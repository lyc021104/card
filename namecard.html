<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>陈宗杰 · 个人名片</title>
<style>
  :root {
    /* —— 在这里改主题色 —— */
    --brand: #4f46e5;        /* 主色（品牌色） */
    --brand-deep: #3730a3;   /* 深色，用于渐变 */
    --text: #1e1b2e;
    --text-soft: #6b6b7b;
    --card: #ffffff;
    --bg: #f3f4f8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部渐变头部 */
  .hero {
    background: linear-gradient(135deg, var(--brand-deep) 0%, var(--brand) 100%);
    padding: 56px 24px 72px;
    text-align: center;
    color: #fff;
    position: relative;
  }
  .hero::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 28px;
    background: var(--bg);
    border-radius: 28px 28px 0 0;
  }

  .avatar {
    width: 104px; height: 104px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 3px solid rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .hero h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .hero .role { font-size: 15px; opacity: 0.9; margin-top: 6px; }

  /* 主体卡片 */
  .container {
    max-width: 460px;
    margin: -44px auto 0;
    padding: 0 16px 40px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(30, 27, 46, 0.08);
    padding: 28px 22px;
  }

  .intro {
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee;
    margin-bottom: 18px;
  }
  .intro p { color: var(--text-soft); font-size: 14.5px; }

  .section-title {
    font-size: 13px; color: var(--text-soft);
    text-transform: uppercase; letter-spacing: 2px;
    margin: 4px 0 12px;
  }

  /* 联系方式列表 */
  .contact-list { list-style: none; }
  .contact-list li {
    display: flex; align-items: center;
    gap: 14px;
    padding: 13px 12px;
    border-radius: 12px;
    transition: background 0.15s;
    cursor: pointer;
  }
  .contact-list li:hover { background: #f6f6fa; }
  a.contact { text-decoration: none; color: inherit; }

  .icon {
    width: 40px; height: 40px; flex: 0 0 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .icon svg { width: 20px; height: 20px; }

  .meta { flex: 1; min-width: 0; }
  .meta .label { font-size: 12px; color: var(--text-soft); }
  .meta .value { font-size: 15px; font-weight: 600; word-break: break-all; }

  .copy-hint {
    font-size: 11px; color: #a0a0b0;
    border: 1px solid #e3e3ec; border-radius: 6px;
    padding: 2px 8px; white-space: nowrap;
  }

  /* 社交链接 */
  .socials { display: flex; gap: 10px; margin-top: 4px; }
  .socials a {
    flex: 1; text-align: center;
    padding: 11px 0; border-radius: 12px;
    background: #f6f6fa; color: var(--text);
    text-decoration: none; font-size: 14px; font-weight: 600;
    transition: transform 0.12s, background 0.15s;
  }
  .socials a:hover { background: #ececff; transform: translateY(-2px); }

  footer {
    text-align: center; margin-top: 24px;
    color: #a0a0b0; font-size: 12px;
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="avatar">陈</div>
    <!-- 有头像图片时，把上面一行换成：
    <div class="avatar"><img src="你的头像图片地址" alt="头像"></div> -->
    <h1>陈宗杰</h1>
    <div class="role">学生 · Python 开发者</div>
  </header>

  <main class="container">
    <div class="card">

      <section class="intro">
        <p>你好，我是陈宗杰。热爱编程与学习，喜欢用技术解决实际问题，欢迎与我交流。</p>
      </section>

      <h2 class="section-title">联系方式</h2>
      <ul class="contact-list">
        <li>
          <a class="contact" href="tel:13800000000" style="display:contents;">
            <span class="icon" style="background:#10b981;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <span class="meta">
              <span class="label">电话</span>
              <span class="value">138-0000-0000</span>
            </span>
          </a>
        </li>

        <li>
          <a class="contact" href="mailto:chenzongjie@example.com" style="display:contents;">
            <span class="icon" style="background:#f59e0b;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <span class="meta">
              <span class="label">邮箱</span>
              <span class="value">chenzongjie@example.com</span>
            </span>
          </a>
        </li>

        <li id="wechat">
          <span class="icon" style="background:#22c55e;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <span class="meta">
            <span class="label">微信</span>
            <span class="value" id="wechat-value">czj_123456</span>
          </span>
          <span class="copy-hint" id="copy-btn">复制</span>
        </li>

        <li>
          <span class="icon" style="background:#3b82f6;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </span>
          <span class="meta">
            <span class="label">地址</span>
            <span class="value">中国 · 某市某区</span>
          </span>
        </li>
      </ul>

      <h2 class="section-title" style="margin-top:18px;">更多链接</h2>
      <div class="socials">
        <a href="https://github.com/你的用户名" target="_blank" rel="noopener">GitHub</a>
        <a href="https://你的博客地址" target="_blank" rel="noopener">博客</a>
      </div>

    </div>
    <footer>扫码即可打开本页 · 由 Cloudflare Pages 托管</footer>
  </main>

<script>
  // 复制微信号
  var btn = document.getElementById('copy-btn');
  var val = document.getElementById('wechat-value').textContent;
  btn.addEventListener('click', function () {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(val).then(function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制'; }, 1500);
      });
    } else {
      // 旧浏览器降级方案
      var t = document.createElement('textarea');
      t.value = val; document.body.appendChild(t); t.select();
      document.execCommand('copy'); document.body.removeChild(t);
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1500);
    }
  });
</script>
</body>
</html>
